version: 2
updates:
# One pull request per ecosystem per cycle: a single operator reviews one diff,
# not one e-mail per package.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo:
        patterns: ["*"]
    labels: [dependencies, rust]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ["*"]
    labels: [dependencies, web]
    ignore:
      # The Studio runs on Node 22 (engines, Dockerfile); its types follow the runtime major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
    labels: [dependencies, docker]
