[workspace]
resolver = "2"
members = [
    "crates/framechester-core",
    "crates/framechester-adapters",
    "crates/framechester-motion",
    "crates/framechester-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/prod455/framechester"
homepage = "https://github.com/prod455/framechester"
readme = "README.md"
keywords = ["video", "youtube", "ffmpeg", "tts", "media-production"]
categories = ["multimedia::video", "command-line-utilities"]
# The crates are built from this repository; they are not published to crates.io.
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
sha2 = "0.11"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
