# Configuracao sanitizada de dois canais locais sob o mesmo operador.
# Copie para framechester.toml (ignorado pelo Git). IDs locais nao sao IDs YouTube.
# Informe youtube_channel_id somente no arquivo privado quando conhecido.

[[channels]]
id = "tech"
# Visual do canal: noite (padrao), papel (risografia) ou planta (blueprint).
look = "planta"

[[channels]]
id = "science"
look = "papel"

# Canais monetizaveis em ingles (RPM maior que pt-BR): explicadores originais narrados.
# money-explained: financas pessoais (primeiro roteiro: examples/juros-compostos.roteiro.json).
[[channels]]
id = "money-explained"
language = "en-US"
look = "papel"
# Links de afiliado: entram na descricao so dos videos que dizem um dos termos, com aviso no topo.
# Troque pela URL real do seu programa (ex.: link do Amazon Associates com o seu tag).
[[channels.affiliates]]
label = "The Psychology of Money (book)"
url = "https://example.com/troque-pelo-seu-link"
terms = ["compound interest", "invest", "retirement"]

# tech-explained: tecnologia e IA.
[[channels]]
id = "tech-explained"
language = "en-US"
look = "planta"

[app]
dry_run = true
telemetry = false
workdir = "artifacts"

[render]
width = 1920
height = 1080
fps = 30

[tts]
piper_path = "C:/piper/piper.exe"
voice_model = "C:/piper/pt_BR-faber-medium.onnx"
voice_name = "pt_BR-faber-medium"

[publish]
enabled = false
privacy = "private"
